# Owned disposable stack only. Never use existing volume names.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uav_e2e
      POSTGRES_USER: uav_test
      POSTGRES_PASSWORD: ${UAV_TEST_DB_PASSWORD:?Generated by runner}
    ports: ["127.0.0.1:${UAV_E2E_DB_PORT:-55446}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uav_test -d uav_e2e]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: uav-pas-minio-test:2025-09-07
    build: ../minio-test
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${UAV_TEST_STORAGE_USER:?Generated by runner}
      MINIO_ROOT_PASSWORD: ${UAV_TEST_STORAGE_PASSWORD:?Generated by runner}
    ports: ["127.0.0.1:${UAV_E2E_STORAGE_PORT:-9044}:9000", "127.0.0.1:${UAV_E2E_STORAGE_CONSOLE_PORT:-9045}:9001"]
    volumes: ["minio:/data"]
volumes:
  postgres:
    name: ${COMPOSE_PROJECT_NAME}_postgres_${UAV_VOLUME_GENERATION:-source}
  minio:
    name: ${COMPOSE_PROJECT_NAME}_minio_${UAV_VOLUME_GENERATION:-source}
