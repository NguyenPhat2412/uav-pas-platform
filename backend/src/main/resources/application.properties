spring.application.name=uav-pas-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100,http://localhost:3101,http://localhost:3102,http://localhost:3103}

# Cookie Security Configuration (HttpOnly Cookie Authentication)
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.domain=${APP_COOKIE_DOMAIN:}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5500/uav_pas_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Flyway owns schema changes; Hibernate only checks that mappings match.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
# Parallel work can ship a lower version after a higher one (prod had V40 before V37-V39): apply it instead of
# refusing to start. Migrations are written to be independent of each other's order.
spring.flyway.out-of-order=${SPRING_FLYWAY_OUT_OF_ORDER:true}
app.phase1.compatibility-schema.enabled=false
# Every statement (scheduled jobs included) was printed before: off by default, APP_SHOW_SQL=true to debug.
spring.jpa.show-sql=${APP_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${APP_SHOW_SQL:false}
spring.jpa.properties.hibernate.highlight_sql=${APP_SHOW_SQL:false}
spring.jpa.open-in-view=false
# One business zone for the JVM (set in UavPlatformApplication.main) and JDBC timestamp binding.
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# Liveness/readiness endpoint used by local orchestration and acceptance checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# SpringDoc OpenAPI / Swagger UI
# The OpenAPI document maps every endpoint; production turns it off (APP_API_DOCS_ENABLED=false) so it cannot
# be fetched even if a proxy rule forgets to block it.
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Email / OTP / 2FA Configuration
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Without these a hung SMTP server can block OTP sends indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.enabled=${APP_MAIL_ENABLED:false}
management.health.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@uav.all1.vn}
app.auth.otp-ttl-minutes=${APP_AUTH_OTP_TTL_MINUTES:10}
app.auth.totp-issuer=${APP_AUTH_TOTP_ISSUER:UAV PAS}
# Local development only: echo OTP codes in API responses and logs. Never enable on a shared or public server.
app.auth.otp-dev-preview=${APP_AUTH_OTP_DEV_PREVIEW:false}
# Allowed email domains/suffixes for registration & OTP (comma-separated; leading dot matches subdomains, e.g. .edu.vn; * allows any non-blocked domain).
app.auth.email.allowed-domains=${APP_AUTH_ALLOWED_EMAIL_DOMAINS:gmail.com,googlemail.com,outlook.com,outlook.com.vn,hotmail.com,live.com,msn.com,icloud.com,me.com,mac.com,yahoo.com,yahoo.com.vn,proton.me,protonmail.com,zoho.com,.edu.vn,.ac.vn,.gov.vn,.edu,.ac.jp}
app.auth.email.blocked-domains=${APP_AUTH_BLOCKED_EMAIL_DOMAINS:}
# Auth & outbound OTP rate limits (sliding 15-minute window + 60s resend cooldown + 1-minute global SMTP budget).
app.auth.rate-limit.enabled=${APP_AUTH_RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.otp-per-account=${APP_AUTH_OTP_PER_ACCOUNT:3}
app.auth.rate-limit.otp-per-ip=${APP_AUTH_OTP_PER_IP:8}
app.auth.rate-limit.max-emails-per-minute=${APP_AUTH_MAX_EMAILS_PER_MINUTE:15}
# Login-2FA / enable-2FA codes (after a password or in a session) have their own per-minute budget.
app.auth.rate-limit.max-signed-in-emails-per-minute=${APP_AUTH_MAX_SIGNED_IN_EMAILS_PER_MINUTE:60}
app.auth.rate-limit.resend-cooldown-seconds=${APP_AUTH_OTP_COOLDOWN_SECONDS:60}
# Sign in with Google: OAuth web client IDs (comma-separated) accepted as the ID token audience. Empty turns it off (503).
app.auth.google.client-ids=${GOOGLE_CLIENT_ID:}

# Payment IPN Webhook Security (VietQR NAPAS 24/7)
app.billing.ipn-secret=${APP_BILLING_IPN_SECRET:}
app.billing.provider-enabled=${APP_BILLING_PROVIDER_ENABLED:false}
# VietQR / NAPAS 247 receiving account. Bank transfer is offered only when BIN, number and name are all set.
app.billing.bank-bin=${APP_BILLING_BANK_BIN:}
app.billing.bank-name=${APP_BILLING_BANK_NAME:}
app.billing.bank-account-number=${APP_BILLING_BANK_ACCOUNT_NUMBER:}
app.billing.bank-account-name=${APP_BILLING_BANK_ACCOUNT_NAME:}
# Invoice amounts are VAT inclusive; this rate only splits them for display.
app.billing.vat-rate=${APP_BILLING_VAT_RATE:0.10}
# Encrypts the 9router API key at rest; defaults to a key derived from the JWT secret when unset.
app.ai-router.secret=${APP_AI_ROUTER_SECRET:}
# Weather & flight safety: the optional provider API key is sealed with AES-256-GCM using this secret
# (falls back to the JWT secret). WEATHER_REMOTE_ENABLED=false serves cached forecasts only.
app.weather.encryption-secret=${APP_WEATHER_ENCRYPTION_SECRET:${app.jwt.secret}}
app.weather.remote-enabled=${WEATHER_REMOTE_ENABLED:true}

# S3-compatible media storage (MinIO in development, AWS S3 in production)
app.storage.provider=${APP_STORAGE_PROVIDER:minio}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.bucket=${APP_STORAGE_BUCKET:uav-pas}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:minioadmin}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.public-endpoint=${APP_STORAGE_PUBLIC_ENDPOINT:}
app.storage.ensure-bucket=${APP_STORAGE_ENSURE_BUCKET:false}
app.storage.cors-origin=${APP_STORAGE_CORS_ORIGIN:http://localhost:3000}

# Admin > Infrastructure (read-only). Build facts are passed in by deploy/docker-compose.prod.yml at build time.
app.public-url=${APP_PUBLIC_URL:}
app.build.version=${APP_VERSION:unknown}
app.build.git-commit=${APP_GIT_COMMIT:unknown}
app.build.time=${APP_BUILD_TIME:unknown}
# Folder holding the daily pg_dump files and LAST_SUCCESS marker, mounted read-only (empty = not configured).
app.backup.dir=${APP_BACKUP_DIR:}
app.backup.stale-after-hours=${APP_BACKUP_STALE_AFTER_HOURS:36}

# Missions: the assigned operator may start a READY mission from this many minutes before its start time.
app.mission.start-lead-minutes=${APP_MISSION_START_LEAD_MINUTES:120}
# Hourly job that resets flight hours of ended quota cycles and downgrades lapsed paid plans.
app.billing.quota-rollover-enabled=${APP_BILLING_QUOTA_ROLLOVER_ENABLED:true}
