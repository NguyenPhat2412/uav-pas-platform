# Isolate Spring context tests from a developer's local PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:uav_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2 builds its test schema through Hibernate. PostgreSQL integration tests enable
# Flyway explicitly to verify migrations including PostgreSQL partial indexes.
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
app.storage.provider=test
app.storage.endpoint=http://localhost:9000
app.storage.bucket=uav-test
app.storage.access-key=test-access
app.storage.secret-key=test-secret
app.storage.region=us-east-1
app.storage.public-endpoint=
app.storage.ensure-bucket=false
app.storage.cors-origin=http://localhost:3000
app.jwt.secret=test-only-secret-change-me-32-bytes-minimum

# Independent PostgreSQL test contexts share one disposable server.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0

# Shared-context tests sign in many times from one address; the limiter has its own unit tests.
app.auth.rate-limit.enabled=false
# Scenario fixtures schedule missions days ahead; the 2 h start window has its own unit test.
app.mission.start-lead-minutes=5256000
# The hourly quota rollover job is exercised directly in unit tests.
app.billing.quota-rollover-enabled=false
