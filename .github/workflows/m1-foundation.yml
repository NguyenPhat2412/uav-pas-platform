name: Full-Stack CI (Frontend, Architecture Contracts & Backend)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-foundation:
    name: Monorepo Portals & Architecture Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces
      - run: npm run typecheck --workspaces
      - run: npm run test --workspaces
      - name: Run Architecture & API Contract Tests
        run: node --test tests/m1-foundation.test.mjs tests/m2-operations.test.mjs tests/m3-admin.test.mjs tests/m4-customer.test.mjs tests/m5-web.test.mjs tests/notifications-billing-reporting.test.mjs tests/sar-ai-cockpit.test.mjs tests/algorithms.test.mjs
      - run: npm run build --workspaces

  legacy-frontend:
    name: Unified Frontend Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-ci:
    name: Spring Boot Backend & Security Hardening Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run Backend Unit & Security Audit Tests
        working-directory: backend
        run: mvn -B test -Dtest=SecurityAuditHardeningTest,AuthControllerTest,AuthServiceTest,JwtServiceTest,PermissionEvaluationServiceTest,UserManagementServiceTest,UavServiceTest,StationServiceTest,InventoryServiceTest,MediaServiceTest
