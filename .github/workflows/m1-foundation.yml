name: Full-Stack CI (Frontend, Architecture Contracts & Backend)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-foundation:
    name: Monorepo Portals & Architecture Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces
      - run: npm run typecheck --workspaces
      - run: npm run test --workspaces
      - name: Run Architecture & API Contract Tests
        run: node --test tests/m1-foundation.test.mjs tests/m2-operations.test.mjs tests/m3-admin.test.mjs tests/m4-customer.test.mjs tests/m5-web.test.mjs tests/notifications-billing-reporting.test.mjs tests/sar-ai-cockpit.test.mjs tests/algorithms.test.mjs
      - run: npm run build --workspaces

  legacy-frontend:
    name: Unified Frontend Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-ci:
    name: Spring Boot Backend & Security Hardening Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create disposable test credentials
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          storage_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$storage_password"
          echo "UAV_TEST_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "UAV_TEST_STORAGE_USER=uav_ci" >> "$GITHUB_ENV"
          echo "UAV_TEST_STORAGE_PASSWORD=$storage_password" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL and MinIO
        run: docker compose -p uav-ci -f docker-compose.stabilization.yml up -d --wait
      - name: Run complete backend suite including PostgreSQL and MinIO
        working-directory: backend
        env:
          UAV_STABILIZATION_DB_URL: jdbc:postgresql://127.0.0.1:55444/uav_stabilization
          UAV_STABILIZATION_DB_USER: uav_test
          UAV_STABILIZATION_DB_PASSWORD: ${{ env.UAV_TEST_DB_PASSWORD }}
          UAV_STABILIZATION_MINIO_ENDPOINT: http://127.0.0.1:9014
          UAV_STABILIZATION_MINIO_USER: ${{ env.UAV_TEST_STORAGE_USER }}
          UAV_STABILIZATION_MINIO_PASSWORD: ${{ env.UAV_TEST_STORAGE_PASSWORD }}
          UAV_STABILIZATION_MINIO_BUCKET: uav-ci-tests
        run: ./mvnw -B test
      - name: Remove disposable services
        if: always()
        run: docker compose -p uav-ci -f docker-compose.stabilization.yml down --volumes
