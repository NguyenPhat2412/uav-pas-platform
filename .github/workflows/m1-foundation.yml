name: Full-Stack CI (Frontend, Architecture Contracts & Backend)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --workspaces
      - run: npm run typecheck --workspaces
      - run: npm run test --workspaces
      - name: Run Architecture & API Contract Tests
        run: npm run test:contracts
      - run: npm run build --workspaces

  legacy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/legacy/package-lock.json
      # Shared API-origin tests resolve TypeScript from the frontend workspace.
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: frontend/legacy
      - run: npm run lint
        working-directory: frontend/legacy
      - run: npm run typecheck
        working-directory: frontend/legacy
      - run: npm test
        working-directory: frontend/legacy
      - run: npm run build
        working-directory: frontend/legacy

  backend-ci:
    name: Spring Boot Backend & Security Hardening Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create disposable test credentials
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          storage_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$storage_password"
          echo "UAV_TEST_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "UAV_TEST_STORAGE_USER=uav_ci" >> "$GITHUB_ENV"
          echo "UAV_TEST_STORAGE_PASSWORD=$storage_password" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL and MinIO
        run: docker compose -p uav-ci -f backend/docker-compose.stabilization.yml up -d --wait --wait-timeout 90
      - name: Wait for real object storage readiness
        run: curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:9014/minio/health/ready
      - name: Run complete backend suite including PostgreSQL and MinIO
        working-directory: backend
        env:
          UAV_STABILIZATION_DB_URL: jdbc:postgresql://127.0.0.1:55444/uav_ba_test_suite
          UAV_STABILIZATION_DB_USER: uav_test
          UAV_STABILIZATION_DB_PASSWORD: ${{ env.UAV_TEST_DB_PASSWORD }}
          UAV_STABILIZATION_MINIO_ENDPOINT: http://127.0.0.1:9014
          UAV_STABILIZATION_MINIO_USER: ${{ env.UAV_TEST_STORAGE_USER }}
          UAV_STABILIZATION_MINIO_PASSWORD: ${{ env.UAV_TEST_STORAGE_PASSWORD }}
          UAV_STABILIZATION_MINIO_BUCKET: uav-ci-tests
        run: python3 infra/ci/backend_tests.py
      - name: Remove disposable services
        if: always()
        run: docker compose -p uav-ci -f backend/docker-compose.stabilization.yml down --volumes
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-counts
          path: docs/work/backend-test-safe/result.json
          retention-days: 7
      - name: Remove private backend logs
        if: always()
        run: rm -rf docs/work/backend-test-private

  dependency-audit:
    name: Production gate and full dependency audit (no suppressions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/legacy/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix frontend/legacy
      - name: Audit both final dependency trees; full dev findings fail visibly
        run: python3 backend/infra/ci/audit.py --output docs/work/audit-safe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit-summary
          path: docs/work/audit-safe/audit-summary.json
          retention-days: 7

  browser-e2e:
    name: Production browser against real PostgreSQL and MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/legacy/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci --prefix frontend
      - run: npm ci --prefix frontend/legacy
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and run isolated browser suite
        run: python3 backend/infra/ci/run.py --project uav-ci-browser --work-dir docs/work/browser-private --result-dir docs/work/browser-safe
      - name: Cleanup owned resources even if the runner is interrupted
        if: always()
        run: |
          if test -f docs/work/browser-private/owns-resources; then
            docker ps -aq --filter label=com.docker.compose.project=uav-ci-browser | xargs -r docker rm -f
            docker volume ls -q --filter label=com.docker.compose.project=uav-ci-browser | xargs -r docker volume rm
          fi
          rm -rf docs/work/browser-private
      # Only these two allowlisted JSON files are artifacts. No screenshots, traces,
      # HAR, cookies, fixtures, env files, server logs, signed URLs or private backups.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-assertions
          path: |
            docs/work/browser-safe/browser.json
            docs/work/browser-safe/runner.json
          retention-days: 7
