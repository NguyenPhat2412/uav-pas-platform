name: Automated Postman API Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run 130 Postman API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uav_pas_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me-local
        ports:
          - 5500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build and Start Backend Server
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5500/uav_pas_dev
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: change-me-local
          APP_JWT_SECRET: uav-pas-platform-jwt-secret-key-32-chars-long-minimum-local-dev
          APP_STORAGE_PROVIDER: test
        run: |
          ./mvnw spring-boot:run &
          echo "Waiting for Spring Boot to start on port 8080..."
          for i in {1..40}; do
            if curl -s -f http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is UP and healthy!"
              break
            fi
            sleep 2
          done

      - name: Initialize Admin Test Account
        run: |
          curl -s -X POST http://localhost:8080/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","email":"admin@uav-platform.com","password":"Password123@","phoneNumber":"0987654321"}' || true
          PGPASSWORD=change-me-local psql -h localhost -p 5500 -U postgres -d uav_pas_dev -c "UPDATE users SET role = 'ROLE_ADMIN' WHERE username = 'admin';"

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -n "$POSTMAN_API_KEY" ]; then
            echo "Logging in to Postman with provided API Key..."
            postman login --with-api-key "$POSTMAN_API_KEY"
          else
            echo "No POSTMAN_API_KEY found in repository secrets. Running in local CLI mode."
          fi

      - name: Run 130 Postman API Tests
        run: |
          postman collection run uav-pas-platform.postman_collection.json
