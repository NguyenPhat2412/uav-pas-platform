# Disposable test stack. Does not mount or reuse existing development volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uav_stabilization
      POSTGRES_USER: uav_test
      POSTGRES_PASSWORD: ${UAV_TEST_DB_PASSWORD:?Supply isolated test password}
    ports: ["127.0.0.1:55444:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uav_test -d uav_stabilization]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${UAV_TEST_STORAGE_USER:?Supply isolated storage user}
      MINIO_ROOT_PASSWORD: ${UAV_TEST_STORAGE_PASSWORD:?Supply isolated storage password}
    ports: ["127.0.0.1:9014:9000", "127.0.0.1:9015:9001"]
