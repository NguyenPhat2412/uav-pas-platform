# Host nginx for the UAV PAS API on its own origin. The web app (uav.all1.vn) calls it cross-origin:
# CORS allows https://uav.all1.vn with credentials, and APP_COOKIE_DOMAIN=uav.all1.vn shares the session
# and XSRF-TOKEN cookies between the two hosts (same site, so SameSite=Lax still sends them).
#
# Install as plain HTTP, then let certbot add TLS:
#   cp api.uav.all1.vn.conf /etc/nginx/sites-available/api.uav.all1.vn
#   ln -sf /etc/nginx/sites-available/api.uav.all1.vn /etc/nginx/sites-enabled/api.uav.all1.vn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.uav.all1.vn --redirect

# Edge rate-limit zones (shared across workers in http {} context via sites-enabled include):
# - uav_api_auth_otp: tight cap (6 req/min per IP, small burst) on endpoints that send an OTP email
# - uav_api_general: general API burst protection (30 req/s per IP; a dashboard fires many queries at once and a campus shares one IP)
limit_req_zone $binary_remote_addr zone=uav_api_auth_otp:10m rate=6r/m;
# - uav_api_auth_login: sign-in and code entry, roomier for many users behind one NAT (campus, office)
limit_req_zone $binary_remote_addr zone=uav_api_auth_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=uav_api_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.uav.all1.vn;

    # Media uploads go browser -> R2 directly; API bodies stay small.
    client_max_body_size 10m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public auth & OTP write endpoints: throttled at the edge before reaching Spring Boot / SMTP.
    location ~ ^/api/v1/auth/(register|register-otp|resend-otp|forgot-password|2fa/setup)$ {
        limit_req zone=uav_api_auth_otp burst=4 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 30s;
    }

    # Sign-in and code entry (Spring Boot also limits per account, per IP and per wrong code).
    location ~ ^/api/v1/auth/(login|google|verify-email|verify-2fa|reset-password)$ {
        limit_req zone=uav_api_auth_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 30s;
    }

    # REST API (Spring Boot)
    location /api/ {
        limit_req zone=uav_api_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 120s;
    }

    # Actuator stays private; only the health probe is reachable.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:18080;
    }

    # API docs are never public: they map every endpoint for scrapers (springdoc is also off, APP_API_DOCS_ENABLED=false).
    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    location / {
        return 404;
    }
}
