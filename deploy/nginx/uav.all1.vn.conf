# Host nginx for the UAV PAS web app. The browser calls the API at api.uav.all1.vn (api.uav.all1.vn.conf);
# /api/** here still reaches Spring Boot so links and clients that use the web origin keep working.
#
# Install as plain HTTP, then let certbot add TLS (same as the other sites on this VPS):
#   cp uav.all1.vn.conf /etc/nginx/sites-available/uav.all1.vn
#   ln -sf /etc/nginx/sites-available/uav.all1.vn /etc/nginx/sites-enabled/uav.all1.vn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d uav.all1.vn --redirect

# OTP-sending endpoints stay tight; sign-in and code entry get room for many users behind one NAT
# (a campus or office), since Spring Boot also limits per account, per IP and per wrong code.
limit_req_zone $binary_remote_addr zone=uav_web_auth_otp:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=uav_web_auth_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=uav_web_api_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name uav.all1.vn;

    # uav.all1.vn is proxied by Cloudflare: take the visitor's address from CF-Connecting-IP, trusted only
    # when the peer is a Cloudflare edge (ranges from https://www.cloudflare.com/ips, 2026-11-01), so limits
    # below and the X-Real-IP sent to Spring Boot count real visitors, not Cloudflare's shared edge IPs.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # Media uploads go browser -> R2 directly; API bodies stay small.
    client_max_body_size 10m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Endpoints that send an OTP email: throttled identically to api.uav.all1.vn.
    location ~ ^/api/v1/auth/(register|register-otp|resend-otp|forgot-password|2fa/setup)$ {
        limit_req zone=uav_web_auth_otp burst=4 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 30s;
    }

    # Sign-in and code entry.
    location ~ ^/api/v1/auth/(login|google|verify-email|verify-2fa|reset-password)$ {
        limit_req zone=uav_web_auth_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 30s;
    }

    # REST API (Spring Boot)
    location /api/ {
        limit_req zone=uav_web_api_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 120s;
    }

    # Actuator stays private; only the health probe is reachable.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:18080;
    }

    # Block public access to Swagger / OpenAPI docs on the web origin as well.
    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    # Web app (Next.js)
    location / {
        proxy_pass http://127.0.0.1:13100;
    }
}
