# Host nginx for UAV PAS. One public origin: /api/** goes to Spring Boot, everything else to Next.js,
# so auth cookies stay host-only and the browser needs no CORS between web and API.
#
# Install as plain HTTP, then let certbot add TLS (same as the other sites on this VPS):
#   cp uav.all1.vn.conf /etc/nginx/sites-available/uav.all1.vn
#   ln -sf /etc/nginx/sites-available/uav.all1.vn /etc/nginx/sites-enabled/uav.all1.vn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d uav.all1.vn --redirect

server {
    listen 80;
    listen [::]:80;
    server_name uav.all1.vn;

    # Media uploads go browser -> R2 directly; API bodies stay small.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST API (Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 120s;
    }

    # Actuator stays private; only the health probe is reachable.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:18080;
    }

    # Web app (Next.js)
    location / {
        proxy_pass http://127.0.0.1:13100;
    }
}
