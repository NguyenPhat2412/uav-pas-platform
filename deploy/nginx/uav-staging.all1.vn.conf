# Host nginx for the UAV PAS Staging environment (uav-staging.all1.vn -> 127.0.0.1:28080 / 127.0.0.1:23100).
# Single-level subdomain under *.all1.vn works with Cloudflare Universal SSL and Let's Encrypt certbot.
#
# Install on VPS:
#   cp uav-staging.all1.vn.conf /etc/nginx/sites-available/uav-staging.all1.vn
#   ln -sf /etc/nginx/sites-available/uav-staging.all1.vn /etc/nginx/sites-enabled/uav-staging.all1.vn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d uav-staging.all1.vn --redirect

limit_req_zone $binary_remote_addr zone=uav_stg_auth_otp:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=uav_stg_auth_login:10m rate=40r/m;
limit_req_zone $binary_remote_addr zone=uav_stg_api_general:10m rate=40r/s;

server {
    listen 80;
    listen [::]:80;
    server_name uav-staging.all1.vn;

    # Trust visitor IPs forwarded by Cloudflare edge nodes
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Prevent search engines from indexing Staging
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 10m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/v1/auth/(register|register-otp|resend-otp|forgot-password|2fa/setup)$ {
        limit_req zone=uav_stg_auth_otp burst=6 nodelay;
        proxy_pass http://127.0.0.1:28080;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/auth/(login|google|verify-email|verify-2fa|reset-password)$ {
        limit_req zone=uav_stg_auth_login burst=15 nodelay;
        proxy_pass http://127.0.0.1:28080;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=uav_stg_api_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:28080;
        proxy_read_timeout 120s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:28080;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:23100;
    }
}
