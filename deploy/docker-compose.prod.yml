# UAV PAS production stack. Run from this folder:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Media lives in Cloudflare R2, so there is no MinIO here. Every port binds to 127.0.0.1 only;
# the host's nginx (deploy/nginx/uav.all1.vn.conf) is the single public entry point.
name: uav-pas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./.env.production
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are compiled into the bundle, so changing them needs a rebuild.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ENVIRONMENT: production
        NEXT_PUBLIC_DISPATCH_HOTLINE: ${NEXT_PUBLIC_DISPATCH_HOTLINE:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13100}:3100"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
